<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketFlow - Sign In</title>
    <meta name="description" content="Sign in to MarketFlow">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <div id="toast" class="toast-notification"></div>

    <main class="auth-layout">
        
        <!-- Left Side: Marketing/Branding -->
        <aside class="auth-sidebar">
            <div class="sidebar-content">
                <!-- Content removed because it is baked into the UI mockup image background -->
            </div>
        </aside>

        <!-- Right Side: Authentication Forms -->
        <section class="auth-content">
            
            <div class="auth-card" id="loginView">
                <header class="card-header">
                    <!-- Form Logo -->
                    <div class="logo-center">
                        <svg width="28" height="28" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 2L4 10L20 18L36 10L20 2Z" fill="#d31f26"/>
                            <path d="M4 18L20 26L36 18" stroke="#d31f26" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M4 26L20 34L36 26" stroke="#d31f26" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        MarketFlow
                    </div>
                    <h1>Welcome back 👋</h1>
                    <p>Please enter your details to sign in.</p>
                </header>

                <form id="loginForm" novalidate>
                    <!-- Email/Username Input -->
                    <div class="input-group">
                        <label for="loginEmail" class="input-label">Email or Username</label>
                        <div class="input-wrapper">
                            <div class="input-icon-left">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            </div>
                            <input type="text" id="loginEmail" class="input-field" placeholder="Enter your email or username" required autocomplete="username">
                        </div>
                    </div>
                    
                    <!-- Password Input -->
                    <div class="input-group">
                        <label for="loginPassword" class="input-label">Password</label>
                        <div class="input-wrapper">
                            <div class="input-icon-left">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            </div>
                            <input type="password" id="loginPassword" class="input-field" placeholder="Enter your password" required autocomplete="current-password">
                            <div class="input-icon-right" id="togglePassword">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                            </div>
                        </div>
                    </div>

                    <!-- Options Row -->
                    <div class="form-row-space-between">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe">
                            Remember for 30 days
                        </label>
                        <a href="#" class="text-link">Forgot password?</a>
                    </div>

                    <!-- Sign In Button -->
                    <button type="submit" class="btn btn-primary">
                        Sign in 
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 4px;"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </button>
                    
                    <div class="divider">or</div>
                    
                    <!-- Google SSO -->
                    <button type="button" class="btn btn-outline" id="googleLoginBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        Sign in with Google
                    </button>
                </form>

                <div class="auth-footer">
                    Don't have an account? <a href="#" id="showRegister" class="text-link">Sign up</a>
                </div>
            </div>

            <!-- REGISTER VIEW (Hidden by default) -->
            <div class="auth-card hidden" id="registerView">
                <header class="card-header">
                    <div class="logo-center">
                        <svg width="28" height="28" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 2L4 10L20 18L36 10L20 2Z" fill="#d31f26"/>
                            <path d="M4 18L20 26L36 18" stroke="#d31f26" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M4 26L20 34L36 26" stroke="#d31f26" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        MarketFlow
                    </div>
                    <h1>Create an account</h1>
                    <p>Start your 14-day free trial today.</p>
                </header>

                <form id="registerForm" novalidate>
                    <div class="input-group">
                        <label for="registerName" class="input-label">Full Name</label>
                        <div class="input-wrapper">
                            <div class="input-icon-left">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            </div>
                            <input type="text" id="registerName" class="input-field" placeholder="e.g. John Doe" required autocomplete="name">
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label for="registerEmail" class="input-label">Work Email</label>
                        <div class="input-wrapper">
                            <div class="input-icon-left">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                            </div>
                            <input type="email" id="registerEmail" class="input-field" placeholder="john@company.com" required autocomplete="email">
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label for="registerPassword" class="input-label">Password</label>
                        <div class="input-wrapper">
                            <div class="input-icon-left">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            </div>
                            <input type="password" id="registerPassword" class="input-field" placeholder="Must be at least 8 characters" required autocomplete="new-password">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="margin-top: 24px;">Get Started</button>
                </form>

                <div class="auth-footer">
                    Already have an account? <a href="#" id="showLogin" class="text-link">Log in</a>
                </div>
            </div>

        </section>
    </main>

    <script src="js/auth.js"></script>
    <script>
        // Simple script to handle password visibility toggle
        document.addEventListener('DOMContentLoaded', () => {
            const togglePassword = document.getElementById('togglePassword');
            const passwordField = document.getElementById('loginPassword');
            
            if (togglePassword && passwordField) {
                togglePassword.addEventListener('click', () => {
                    const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordField.setAttribute('type', type);
                    
                    // Toggle icon (eye / eye-off)
                    if (type === 'text') {
                        togglePassword.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
                    } else {
                        togglePassword.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
                    }
                });
            }
        });
    </script>
</body>
</html>
